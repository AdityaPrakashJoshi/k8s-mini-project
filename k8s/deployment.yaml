
apiVersion: apps/v1
kind: Deployment

metadata:
  name: notes-app
  namespace: notes-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: notes-app

  template:
    metadata:
      labels:
        app: notes-app

    spec:
      containers:
        - name: notes-app
          image: notes-app:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
